# Tests and typecheck across Node 20, 22 and 24 on Linux, macOS and Windows.
# Three OSes because WASM loading and path handling differ between them (TODO/build-002-publish.md, step 5).
#
# Manual only: Actions minutes cost money, so nothing here runs on push or pull request. The everyday gate is the
# local pre-push hook (.githooks/pre-push). Start this from the Actions tab when a change touches WASM loading or
# file paths and needs checking on Windows or Linux.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
